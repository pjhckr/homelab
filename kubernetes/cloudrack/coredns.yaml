# CoreDNS is deployed and owned by Talos (bootstrap manifests, refreshed by `talosctl upgrade-k8s`); this file
# only adds fields Talos doesn't manage (server-side apply keeps them): trafficDistribution on the kube-dns
# Service and a required anti-affinity on the Deployment.
#
# One CoreDNS replica runs on each node. Talos' manifest only prefers spreading, so after a node reboot both
# replicas stayed on the other node; the required anti-affinity forbids that (while a node is down, its replica
# stays Pending and the other one serves everything). PreferSameNode makes pods ask the CoreDNS on their
# own node, which forwards external names to that node's Talos host DNS (1.1.1.1/1.0.0.1, answered from India
# for homerack and from France for cloudrack). Without it, half of homerack's lookups crossed to France
# (~200 ms per query, ~840 ms per external name with ndots:5) and got France-located CDN answers.
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
spec:
  trafficDistribution: PreferSameNode
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  k8s-app: kube-dns
              topologyKey: kubernetes.io/hostname
