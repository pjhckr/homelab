# Immich server on cloudrack, with its own Postgres in the same pod (sidecar), so the two are upgraded together.
# Postgres listens on 127.0.0.1 only (reachable from this pod alone), so it trusts local connections and needs no
# password. Data on cloudrack's local disk (local-path-cloudrack). Immich's nightly DB backup (pg_dumpall) writes to
# the library on the storage box (backups/).
# Redis-compatible cache: shared Valkey (valkey.yaml). Machine learning is disabled (no immich-machine-learning pod).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: immich-postgres
    namespace: default
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: local-path-cloudrack
    resources:
        requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: immich-server
    namespace: default
    labels:
        app: immich-server
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: immich-server
    template:
        metadata:
            labels:
                app: immich-server
        spec:
            nodeSelector:
                kubernetes.io/hostname: cloudrack
            initContainers:
                # Native sidecar: starts (and is ready) before Immich, stops after it.
                - name: postgres
                  restartPolicy: Always
                  # Immich's build: Postgres + VectorChord (>=0.3 <2.0) + pgvector, vchord preloaded. Immich supports
                  # Postgres >=14 <20. Upgrade VectorChord with the image; Immich (superuser) updates the extension.
                  image: ghcr.io/immich-app/postgres:17-vectorchord1.1.1-pgvector0.8.5
                  args: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "listen_addresses=127.0.0.1"]
                  env:
                    - name: POSTGRES_USER
                      value: postgres
                    - name: POSTGRES_DB
                      value: immich
                    - name: POSTGRES_HOST_AUTH_METHOD # only reachable over the pod's loopback
                      value: trust
                    - name: POSTGRES_INITDB_ARGS
                      value: --data-checksums
                  startupProbe:
                    exec:
                        command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "immich"]
                    periodSeconds: 5
                    failureThreshold: 60
                  livenessProbe:
                    exec:
                        command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "immich"]
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                  resources:
                    requests:
                        cpu: 50m
                        memory: 256Mi
                    limits:
                        memory: 1Gi
                  volumeMounts:
                    - name: postgres-data
                      mountPath: /var/lib/postgresql/data
                    - name: shm
                      mountPath: /dev/shm
            containers:
                - name: server
                  # Bump deliberately: take a DB dump first (last: manual-pre-upgrade-20261015T083655-v3.3.1.sql.gz in the library's backups/).
                  image: ghcr.io/immich-app/immich-server:v3.3.3
                  env:
                    - name: DB_HOSTNAME # the postgres sidecar; user postgres, database immich (Immich's defaults)
                      value: 127.0.0.1
                    - name: REDIS_HOSTNAME
                      value: valkey.default.svc.cluster.local
                    - name: REDIS_PORT
                      value: "6379"
                    - name: IMMICH_MACHINE_LEARNING_ENABLED
                      value: "false"
                    # Asset paths stored in the DB are under /usr/src/app/upload.
                    - name: IMMICH_MEDIA_LOCATION
                      value: /usr/src/app/upload
                  ports:
                    - containerPort: 2283
                      name: http
                  resources:
                    requests:
                        cpu: 100m
                        memory: 256Mi
                    limits:
                        cpu: "2" # at most 2 of cloudrack's 4 cores (heavy jobs get throttled, not the whole node)
                        memory: 2Gi
                  # First boot runs migrations and rebuilds vector indexes; allow up to 30 min.
                  startupProbe:
                    httpGet:
                        path: /api/server/ping
                        port: 2283
                    periodSeconds: 10
                    failureThreshold: 180
                  readinessProbe:
                    httpGet:
                        path: /api/server/ping
                        port: 2283
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                        path: /api/server/ping
                        port: 2283
                    periodSeconds: 20
                    failureThreshold: 3
                  volumeMounts:
                    - name: storagebox-shared
                      mountPath: /usr/src/app/upload
                      subPath: my_media/immich_library
                    - name: storagebox-shared
                      mountPath: /mnt/storage_box/my_media/wedding_photos
                      subPath: my_media/wedding_photos
                      readOnly: true
            volumes:
                - name: postgres-data
                  persistentVolumeClaim:
                    claimName: immich-postgres
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 128Mi
                - name: storagebox-shared
                  persistentVolumeClaim:
                    claimName: storagebox-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
    name: immich-server
    namespace: default
    labels:
        app: immich-server
spec:
    ports:
        - port: 2283
          targetPort: 2283
          name: http
    selector:
        app: immich-server
---
# Reachable through cloudrack-gateway on its Tailscale IP (see gateway.yaml); DNS record created by external-dns.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: immich
    namespace: default
spec:
    parentRefs:
        - name: cloudrack-gateway
          sectionName: https-wildcard
    hostnames:
        - immich.${DOMAIN}
    rules:
        - backendRefs:
            - name: immich-server
              port: 2283
          # Large photo/video uploads and video streaming: disable Envoy's default 15s request timeout.
          timeouts:
            request: 0s
