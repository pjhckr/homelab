      otlp:
        protocols:
          grpc: {}
          http: {}
      prometheus:
        config:
          scrape_configs:
          - authorization:
              credentials_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              type: Bearer
            job_name: cadvisor
            kubernetes_sd_configs:
            - role: node
            metric_relabel_configs:
            - action: keep
              regex: container_fs_(reads_total|writes_total|reads_bytes_total|writes_bytes_total)
              source_labels:
              - __name__
            - action: drop
              regex: ".+;"
              separator: ";"
              source_labels:
              - id
              - pod
            metrics_path: "/metrics/cadvisor"
            relabel_configs:
            - action: replace
              replacement: kubelet
              target_label: job
            - action: replace
              source_labels:
              - __meta_kubernetes_node_name
              target_label: node
            sample_limit: 10000
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            tls_config:
              ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              insecure_skip_verify: true
          - job_name: kube-state-metrics
            metric_relabel_configs:
            - action: keep
              regex: kube_(pod_info|pod_created|pod_status_phase|pod_status_ready|pod_status_reason|pod_container_info|pod_container_status_ready|pod_container_status_restarts_total|pod_container_resource_requests|pod_container_resource_limits|pod_container_status_waiting.*|pod_container_status_terminated_reason|pod_owner|pod_spec_volumes_persistentvolumeclaims_info|pod_container_security_context_privileged|pod_container_security_context_run_as_user|pod_container_security_context_run_as_non_root|deployment_status_replicas.*|deployment_spec_replicas|deployment_created|daemonset_created|daemonset_status.*|statefulset_replicas|statefulset_created|statefulset_status.*|replicaset_status.*|replicaset_spec_replicas|replicaset_created|replicaset_owner|replicaset_annotations|service_info|service_created|service_spec_type|service_status_load_balancer_ingress|endpoint_address|node_status_condition|node_status_allocatable|node_info|node_spec_taint|node_created|namespace_status_phase|namespace_created|persistentvolumeclaim_status_phase|persistentvolumeclaim_info|persistentvolumeclaim_access_mode|persistentvolumeclaim_resource_requests_storage_bytes|persistentvolumeclaim_created|persistentvolume_info|persistentvolume_created|persistentvolume_status_phase|persistentvolume_capacity_bytes|persistentvolume_access_mode|persistentvolume_reclaim_policy|horizontalpodautoscaler_info|horizontalpodautoscaler_created|horizontalpodautoscaler_status.*|horizontalpodautoscaler_spec.*|job_info|job_created|job_status.*|job_spec.*|job_complete|job_failed|job_owner|cronjob_info|cronjob_created|cronjob_status_active|cronjob_spec_suspend|cronjob_next_schedule_time|ingress_info|ingress_created|ingress_path|ingress_tls|ingress_labels|networkpolicy_created|networkpolicy_spec_ingress_rules|networkpolicy_spec_egress_rules|resourcequota|limitrange|serviceaccount_info|serviceaccount_created)
              source_labels:
              - __name__
            scrape_interval: 30s
            scrape_timeout: 10s
            static_configs:
            - targets:
              - kube-state-metrics.kube-system.svc.cluster.local:8080
          - job_name: coredns
            kubernetes_sd_configs:
            - namespaces:
                names:
                - kube-system
              role: endpoints
            relabel_configs:
            - action: keep
              regex: kube-dns
              source_labels:
              - __meta_kubernetes_service_name
            - action: keep
              regex: metrics
              source_labels:
              - __meta_kubernetes_endpoint_port_name
            scrape_interval: 30s
            scrape_timeout: 10s
          - authorization:
              credentials_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              type: Bearer
            job_name: kube-apiserver
            kubernetes_sd_configs:
            - namespaces:
                names:
                - default
              role: endpoints
            metric_relabel_configs:
            - action: keep
              regex: apiserver_(request_total|request_duration_seconds_bucket|request_duration_seconds_count|admission_webhook_request_total|current_inflight_requests|client_certificate_expiration_seconds.*)|process_resident_memory_bytes|process_cpu_seconds_total|kubernetes_build_info
              source_labels:
              - __name__
            relabel_configs:
            - action: keep
              regex: kubernetes;https
              source_labels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_endpoint_port_name
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            tls_config:
              ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          - authorization:
              credentials_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              type: Bearer
            job_name: kube-scheduler
            kubernetes_sd_configs:
            - namespaces:
                names:
                - kube-system
              role: pod
            relabel_configs:
            - action: keep
              regex: kube-scheduler
              source_labels:
              - __meta_kubernetes_pod_label_component
            - action: replace
              regex: "([^:]+)(?::\\d+)?"
              replacement: "$1:10259"
              source_labels:
              - __address__
              target_label: __address__
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            tls_config:
              insecure_skip_verify: true
          - authorization:
              credentials_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              type: Bearer
            job_name: kube-controller-manager
            kubernetes_sd_configs:
            - namespaces:
                names:
                - kube-system
              role: pod
            relabel_configs:
            - action: keep
              regex: kube-controller-manager
              source_labels:
              - __meta_kubernetes_pod_label_component
            - action: replace
              regex: "([^:]+)(?::\\d+)?"
              replacement: "$1:10257"
              source_labels:
              - __address__
              target_label: __address__
            - source_labels:
              - __meta_kubernetes_pod_node_name
              target_label: node
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            tls_config:
              insecure_skip_verify: true
          - job_name: prometheus-autodiscovery
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - action: keep
              regex: 'true'
              source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            - action: replace
              regex: "(.+)"
              source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: "([^:]+)(?::\\d+)?;(\\d+)"
              replacement: "$1:$2"
              source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
              target_label: __address__
            - action: replace
              regex: "(https?)"
              source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
              target_label: __scheme__
            - source_labels:
              - __meta_kubernetes_namespace
              target_label: namespace
            - source_labels:
              - __meta_kubernetes_pod_name
              target_label: pod
            - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              target_label: service
            sample_limit: 10000
            scrape_interval: 30s
    connectors:
      servicegraph:
        dimensions:
        - http.method
        latency_histogram_buckets:
        - 2ms
        - 4ms
        - 6ms
        - 8ms
        - 10ms
        - 50ms
        - 100ms
        - 200ms
        - 400ms
        - 800ms
        - 1s
        - 1400ms
        - 2s
        - 5s
        - 10s
        - 15s
        store:
          max_items: 10000
          ttl: 30s
    processors:
      attributes:
        actions:
        - key: k8s_cluster
          action: insert
          value: jainrack
      batch:
        send_batch_max_size: 5000
        send_batch_size: 2000
        timeout: 5s
      k8sattributes:
        auth_type: serviceAccount
        extract:
          labels:
          - from: pod
            key: app.kubernetes.io/name
            tag_name: service.name
          - from: pod
            key: k8s-app
            tag_name: k8s.app.name
          - from: pod
            key: app.kubernetes.io/instance
            tag_name: k8s.app.instance
          - from: pod
            key: app.kubernetes.io/version
            tag_name: service.version
          - from: pod
            key: app.kubernetes.io/component
            tag_name: k8s.app.component
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.pod.start_time
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.replicaset.uid
          - k8s.daemonset.name
          - k8s.daemonset.uid
          - k8s.job.name
          - k8s.job.uid
          - k8s.container.name
          - k8s.cronjob.name
          - k8s.statefulset.name
          - k8s.statefulset.uid
          - container.image.tag
          - container.image.name
          - k8s.cluster.uid
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
          - from: resource_attribute
            name: k8s.node.name
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 1s
        limit_mib: 1024
        spike_limit_mib: 256
      resourcedetection:
        detectors:
        - env
        override: true
        timeout: 2s
      transform/strip_crd_spec:
        log_statements:
        - context: log
          statements:
          - set(body["crd_group"], body["spec"]["group"]) where body["kind"] == "CustomResourceDefinition"
          - set(body["crd_scope"], body["spec"]["scope"]) where body["kind"] == "CustomResourceDefinition"
          - set(body["crd_stored_versions"], body["status"]["storedVersions"]) where
            body["kind"] == "CustomResourceDefinition"
          - delete_key(body, "spec") where body["kind"] == "CustomResourceDefinition"
          - delete_key(body, "status") where body["kind"] == "CustomResourceDefinition"
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages: {}
    exporters:
      otlphttp/openobserve:
        endpoint: http://openobserve.default.svc.cluster.local:5080/api/default/
        headers:
          Authorization: "${env:O2_AUTH}"
      otlphttp/openobserve_k8s_events:
        endpoint: http://openobserve.default.svc.cluster.local:5080/api/default/
        headers:
          Authorization: "${env:O2_AUTH}"
          stream-name: k8s_events
    service:
      extensions:
      - health_check
      - zpages
      pipelines:
        logs/k8s_events:
          exporters:
          - otlphttp/openobserve_k8s_events
          processors:
          - memory_limiter
          - resourcedetection
          - attributes
          - k8sattributes
          - transform/strip_crd_spec
          - batch
          receivers:
          - k8sobjects/events
          - k8sobjects/pods
          - k8sobjects/nodes
          - k8sobjects/deployments
          - k8sobjects/services
          - k8sobjects/namespaces
          - k8sobjects/pvcs
          - k8sobjects/daemonsets
          - k8sobjects/statefulsets
          - k8sobjects/ingresses
          - k8sobjects/jobs
          - k8sobjects/cronjobs
          - k8sobjects/persistentvolumes
          - k8sobjects/serviceaccounts
          - k8sobjects/roles
          - k8sobjects/clusterroles
          - k8sobjects/rolebindings
          - k8sobjects/clusterrolebindings
          - k8sobjects/hpa
          - k8sobjects/crds
          - k8sobjects/storageclasses
          - k8sobjects/configmaps
          - k8sobjects/networkpolicies
          - k8sobjects/endpoints
          - k8sobjects/replicasets
          - k8sobjects/limitranges
          - k8sobjects/resourcequotas
        metrics:
          exporters:
          - otlphttp/openobserve
          processors:
          - memory_limiter
          - resourcedetection
          - attributes
          - k8sattributes
          - batch
          receivers:
          - otlp
          - servicegraph
          - prometheus
        traces:
          exporters:
          - otlphttp/openobserve
          - servicegraph
          processors:
          - memory_limiter
          - resourcedetection
          - attributes
          - k8sattributes
          - batch
          receivers:
          - otlp
