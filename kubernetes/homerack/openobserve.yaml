spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openobserve-standalone
      app.kubernetes.io/instance: openobserve
  
  serviceName: openobserve-headless
  template:
    metadata:
      annotations:
        checksum/config: 1fd1204c77365464b51c97087f5197d64dd832884e864f6909444392fc91c5a4
      labels:
        app.kubernetes.io/name: openobserve-standalone
        app.kubernetes.io/instance: openobserve
        app.kubernetes.io/component: openobserve
    spec:
      serviceAccountName: openobserve
      securityContext:
        fsGroup: 2000
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 10000
      
      initContainers:
      containers:
        - name: openobserve-standalone
          securityContext:
            {}
          image: "o2cr.ai/openobserve/openobserve:v1.0.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5080
            - name: grpc
              containerPort: 5081
          livenessProbe:
           httpGet:
             path: /healthz
             port: 5080
           initialDelaySeconds: 10
           periodSeconds: 10
           failureThreshold: 3
          readinessProbe:
           httpGet:
             path: /healthz
             port: 5080
           initialDelaySeconds: 10
           periodSeconds: 10
           failureThreshold: 3
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: openobserve
            - secretRef:
                name: openobserve
          env:
            - name: ZO_ROOT_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: openobserve-root
                  key: ZO_ROOT_USER_EMAIL
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openobserve-root
                  key: ZO_ROOT_USER_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: homerack
      volumes:
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - "ReadWriteOnce"
      storageClassName: local-path-ssd
