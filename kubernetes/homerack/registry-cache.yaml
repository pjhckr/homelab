# Pull-through cache of registry.k8s.io on homerack, for cloudrack's containerd.
# Google's Artifact Registry (behind registry.k8s.io) answers cloudrack's IPv6 range with 403 Forbidden, and
# containerd tries IPv6 first, so cloudrack can't pull Kubernetes images (kube-apiserver, external-dns, ...)
# directly. homerack pulls fine. cloudrack's Talos config (talos/controlplane.enc.yaml, machine.registries)
# mirrors registry.k8s.io to http://<homerack tailnet IP>:5000, with fallback to the upstream registry.
# Published only on homerack's Tailscale IP (like claude-code-webrtc); plain HTTP inside the tailnet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: registry-cache
    namespace: default
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: local-path-ssd
    resources:
        requests:
            storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: registry-cache
    namespace: default
spec:
    replicas: 1
    strategy:
        type: Recreate # single RWO volume
    selector:
        matchLabels:
            app: registry-cache
    template:
        metadata:
            labels:
                app: registry-cache
        spec:
            nodeSelector:
                kubernetes.io/hostname: homerack
            containers:
                - name: registry
                  image: docker.io/library/registry:3.1.2
                  env:
                    - name: REGISTRY_PROXY_REMOTEURL
                      value: https://registry.k8s.io
                    - name: REGISTRY_STORAGE_DELETE_ENABLED # lets the proxy expire cached blobs (default TTL 7 days)
                      value: "true"
                  ports:
                    - containerPort: 5000
                      name: http
                  readinessProbe:
                    httpGet:
                        path: /v2/
                        port: 5000
                  resources:
                    requests:
                        cpu: 20m
                        memory: 32Mi
                    limits:
                        memory: 256Mi
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/registry
            volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: registry-cache
---
apiVersion: v1
kind: Service
metadata:
    name: registry-cache
    namespace: default
spec:
    externalIPs:
        - ${HOMERACK_TS_IP}
    ports:
        - port: 5000
          targetPort: 5000
          name: http
    selector:
        app: registry-cache
