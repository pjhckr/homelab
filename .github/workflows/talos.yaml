name: talos

on:
    push:
        branches: [main]
        paths:
            - talos/controlplane.enc.yaml
            - talos/worker.enc.yaml

concurrency: talos

jobs:
    apply:
        runs-on: ubuntu-latest
        environment: talos
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Install sops and talosctl
              run: |
                  curl -sSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
                  curl -sSLo talosctl https://github.com/siderolabs/talos/releases/download/v1.14.0/talosctl-linux-amd64
                  sudo install sops talosctl /usr/local/bin/
            - name: Apply changed node configs
              run: |
                  for node in controlplane worker; do
                      if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qx "talos/$node.enc.yaml"; then
                          scripts/apply-talos.sh "$node" --apply
                      fi
                  done
              env:
                  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
                  BEFORE: ${{ github.event.before }}
